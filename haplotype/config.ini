# ══════════════════════════════════════════════════════════════════════════════
#  HOMOZYGOSITY ESTIMATOR — CONFIG FILE
#  Edit the paths in [SAMPLES] and [PATHS] to match your environment.
#  All other values are sensible defaults; change only if needed.
# ══════════════════════════════════════════════════════════════════════════════

[PATHS]
# Directory where all output files will be written
results_dir = ./homozygosity_results

[SAMPLES]
# Format: display_label = /full/path/to/sample.hard-filtered.vcf.gz
# Each VCF must have a companion .tbi index (tabix).
#   tabix -p vcf sample.hard-filtered.vcf.gz
1326262332    = /mnt/disk2/Shrusti/haplotype_check/vcfs/1326262332.hard-filtered.vcf.gz
1326003255_LPG = /mnt/disk2/Shrusti/haplotype_check/vcfs/1326003255_LPG.hard-filtered.vcf.gz

[FILTERS]
# Minimum genotype quality (GQ) to include a call (else → no-call)
# Recommendation: 20 for WGS hard-filtered VCFs; 10 for LCG
min_gq             = 20

# Minimum read depth (DP) to include a call
# Recommendation: 8 for WGS; 5 for LCG
min_dp             = 8

# Skip multi-allelic sites (>1 ALT allele)?
# Recommended: true — multi-allelic sites complicate zygosity classification
skip_multiallelic  = true

# Skip indels (retain SNPs only)?
# Recommended: true — SNPs give cleaner ROH signal
skip_indels        = true

[ROH]
# ── Sliding-window ROH detection parameters ──────────────────────────────────
#
# A window of `roh_window_snps` consecutive SNPs is scanned across each
# chromosome.  A window is classified as "in ROH" if the fraction of
# homozygous calls ≥ roh_min_hom_frac.  Adjacent windows are merged, and the
# resulting segment is kept only if it contains ≥ roh_min_snps SNPs AND
# spans ≥ roh_min_length_bp bases.
#
# Tuning guide:
#   roh_min_hom_frac = 0.95  → tolerates ~2–3 het errors per 50-SNP window
#   roh_min_length_bp = 500000 → 500 kb is standard minimum ROH size
#   For LCG (low-coverage, noisier calls): lower min_hom_frac to 0.90

# Window width in number of SNPs
roh_window_snps    = 50

# Minimum SNPs in a called ROH segment
roh_min_snps       = 50

# Minimum fraction of window that must be homozygous  (0.0–1.0)
roh_min_hom_frac   = 0.95

# Minimum physical length (bp) of a called ROH — 500 kb recommended
roh_min_length_bp  = 500000

[VISUALIZATION]
# Figure resolution (DPI)
output_dpi   = 180

# Color theme: 'dark' (recommended for publication) or 'light'
color_scheme = dark
